name: RW MVP native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64:
    name: Native Linux arm64 evidence
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap jq

      - name: Run native qualification
        run: bash scripts/linux-qualification.sh --artifacts "$RUNNER_TEMP/restoreweave-evidence"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restoreweave-linux-arm64-evidence
          path: ${{ runner.temp }}/restoreweave-evidence
          if-no-files-found: error
          retention-days: 14
